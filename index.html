<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pickaxe Mobile Enter-to-Send Test</title>
</head>
<body>
  <h1>Testing:</h1>

  <script src="https://studio.pickaxe.co/api/embed/bundle.js" defer></script>
  <div id="deployment-65f8541a-4cc3-4b47-99b6-af088399d419"></div>

  <script>
    (() => {
      const ROOT_ID = "deployment-65f8541a-4cc3-4b47-99b6-af088399d419";
      const DEBUG = false;

      const log = (...args) => {
        if (DEBUG) console.log("[pickaxe-enter-send]", ...args);
      };

      const getRoot = () => document.getElementById(ROOT_ID);

      const findTextarea = () => getRoot()?.querySelector("textarea") ?? null;

      const findSendButton = (textarea) => {
        const root = getRoot();
        const scope = textarea.closest("form") || root;
        if (!scope) return null;

        const buttons = Array.from(scope.querySelectorAll("button")).filter(
          (button) => !button.disabled,
        );

        const labeledButton = buttons.find((button) => {
          const aria = (button.getAttribute("aria-label") || "").toLowerCase();
          const title = (button.getAttribute("title") || "").toLowerCase();
          const text = (button.textContent || "").toLowerCase();

          return (
            aria.includes("send") ||
            title.includes("send") ||
            text.includes("send")
          );
        });

        if (labeledButton) return labeledButton;

        const submitButton = buttons.find(
          (button) => (button.getAttribute("type") || "").toLowerCase() === "submit",
        );

        return submitButton || buttons[buttons.length - 1] || null;
      };

      const sendMessage = (textarea, reason) => {
        const value = (textarea.value || "").trim();
        if (!value) return;

        const button = findSendButton(textarea);
        if (!button) {
          log("No send button found", reason);
          return;
        }

        log("Sending message", reason);
        button.click();
      };

      const wireTextarea = (textarea) => {
        if (!textarea || textarea.dataset.pickaxeEnterSendWired === "1") return;
        textarea.dataset.pickaxeEnterSendWired = "1";

        textarea.setAttribute("enterkeyhint", "send");

        textarea.addEventListener(
          "keydown",
          (event) => {
            if (event.key !== "Enter") return;
            if (event.shiftKey || event.altKey || event.ctrlKey || event.metaKey) return;

            event.preventDefault();
            event.stopPropagation();

            sendMessage(textarea, "keydown");
          },
          true,
        );

        textarea.addEventListener(
          "beforeinput",
          (event) => {
            const type = event.inputType || "";
            if (type !== "insertLineBreak" && type !== "insertParagraph") return;

            event.preventDefault();
            event.stopPropagation();

            sendMessage(textarea, "beforeinput");
          },
          true,
        );

        textarea.addEventListener(
          "input",
          () => {
            if (!textarea.value.includes("\n")) return;

            textarea.value = textarea.value.replace(/\n+/g, "").trim();
            sendMessage(textarea, "input");
          },
          true,
        );

        log("Attached enter-to-send");
      };

      const attach = () => {
        const textarea = findTextarea();
        if (textarea) wireTextarea(textarea);
      };

      attach();
      new MutationObserver(attach).observe(document.body, {
        childList: true,
        subtree: true,
      });
    })();
  </script>
</body>
</html>
