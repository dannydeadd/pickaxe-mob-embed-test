    <script src="https://studio.pickaxe.co/api/embed/bundle.js" defer></script>
<div id="deployment-65f8541a-4cc3-4b47-99b6-af088399d419"></div>

<script>
(function () {
  const ROOT_ID = "deployment-65f8541a-4cc3-4b47-99b6-af088399d419";
  const DEBUG = true;

  function log(...args) {
    if (DEBUG) console.log("[Pickaxe Enter to Send]", ...args);
  }

  function getRoot() {
    return document.getElementById(ROOT_ID);
  }

  function findTextareas(root) {
    if (!root) return [];

    const results = [];

    root.querySelectorAll("textarea").forEach((el) => results.push(el));

    root.querySelectorAll("*").forEach((el) => {
      if (el.shadowRoot) {
        el.shadowRoot.querySelectorAll("textarea").forEach((ta) => results.push(ta));
      }
    });

    return results;
  }

  function findSendButton(textarea) {
    const root = getRoot();
    const container = textarea.closest("form") || textarea.closest("[class]") || root || document;

    let buttons = Array.from(container.querySelectorAll("button"));

    if (!buttons.length && root) {
      buttons = Array.from(root.querySelectorAll("button"));
    }

    buttons = buttons.filter((button) => !button.disabled);

    const sendButton = buttons.find((button) => {
      const aria = (button.getAttribute("aria-label") || "").toLowerCase();
      const title = (button.getAttribute("title") || "").toLowerCase();
      const text = (button.textContent || "").toLowerCase();

      return (
        aria.includes("send") ||
        title.includes("send") ||
        text.includes("send")
      );
    });

    if (sendButton) return sendButton;

    const submitButton = buttons.find((button) => {
      return (button.getAttribute("type") || "").toLowerCase() === "submit";
    });

    if (submitButton) return submitButton;

    return buttons[buttons.length - 1] || null;
  }

  function sendMessage(textarea) {
    const value = (textarea.value || "").trim();
    if (!value) return;

    const button = findSendButton(textarea);

    if (button) {
      log("Clicking send button", button);
      button.click();
      return;
    }

    const form = textarea.closest("form");
    if (form && typeof form.requestSubmit === "function") {
      log("Submitting form");
      form.requestSubmit();
    }
  }

  function wireTextarea(textarea) {
    if (!textarea || textarea.dataset.enterToSendAttached === "true") return;

    textarea.dataset.enterToSendAttached = "true";
    textarea.setAttribute("enterkeyhint", "send");

    textarea.addEventListener(
      "keydown",
      function (event) {
        if (event.key !== "Enter") return;
        if (event.shiftKey || event.altKey || event.ctrlKey || event.metaKey) return;

        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();

        sendMessage(textarea);
      },
      true
    );

    textarea.addEventListener(
      "beforeinput",
      function (event) {
        if (
          event.inputType !== "insertLineBreak" &&
          event.inputType !== "insertParagraph"
        ) {
          return;
        }

        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();

        sendMessage(textarea);
      },
      true
    );

    textarea.addEventListener(
      "input",
      function () {
        if (!textarea.value.includes("\n")) return;

        textarea.value = textarea.value.replace(/\n+/g, "").trim();
        sendMessage(textarea);
      },
      true
    );

    log("Attached enter-to-send behavior", textarea);
  }

  function attach() {
    const root = getRoot();
    if (!root) return;

    findTextareas(root).forEach(wireTextarea);
  }

  attach();

  const observer = new MutationObserver(attach);
  observer.observe(document.body, {
    childList: true,
    subtree: true
  });

  window.addEventListener("load", attach);
  setTimeout(attach, 1000);
  setTimeout(attach, 3000);
})();
</script>
  </body>
</html>
